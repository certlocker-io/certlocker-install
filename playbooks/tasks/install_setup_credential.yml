---
- name: Provision the Install Setup release-image credential when supplied
  vars:
    install_setup_issuer_file: "{{ lookup('ansible.builtin.env', 'CERTLOCKER_INSTALL_SETUP_ISSUER_FILE') }}"
  become: true
  when: install_setup_issuer_file | length > 0
  block:
    - name: Check the supplied release-image credential file on the controller
      ansible.builtin.stat:
        path: "{{ install_setup_issuer_file }}"
        get_checksum: false
        get_mime: false
        get_attributes: false
      delegate_to: localhost
      become: false
      register: install_setup_issuer_stat
      run_once: true

    - name: Require a nonempty credential file
      ansible.builtin.assert:
        that:
          - install_setup_issuer_stat.stat.isreg | default(false)
          - install_setup_issuer_stat.stat.size | default(0) > 0
        fail_msg: CERTLOCKER_INSTALL_SETUP_ISSUER_FILE must point to a nonempty file on the deployment controller.
      run_once: true

    - name: Create the Install Setup credential directory
      ansible.builtin.file:
        path: /etc/certlocker/install-setup
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install or rotate the release-image credential
      ansible.builtin.copy:
        src: "{{ install_setup_issuer_file }}"
        dest: /etc/certlocker/install-setup/install-image-pull-access
        owner: root
        group: root
        mode: '0400'
      diff: false
      no_log: true
