---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
  register: fail2ban_apt
  retries: 5
  delay: 15
  until: fail2ban_apt is succeeded
  when: ansible_facts.os_family == "Debian"

- name: Fail on unsupported OS family
  ansible.builtin.fail:
    msg: "fail2ban_hardening currently supports Debian/Ubuntu hosts only (got {{ ansible_facts.os_family }})."
  when: ansible_facts.os_family != "Debian"

- name: Install SSH jail hardening
  ansible.builtin.template:
    src: sshd-hardening.local.j2
    dest: /etc/fail2ban/jail.d/sshd-hardening.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
