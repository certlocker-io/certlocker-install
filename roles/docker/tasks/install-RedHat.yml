---
# Alma/Rocky/CentOS Stream: Docker documents the CentOS repo path. RHEL branded hosts use the rhel path.
- name: Set Docker EL repo path component
  ansible.builtin.set_fact:
    docker_el_repo_name: "{{ 'rhel' if ansible_distribution == 'RedHat' else 'centos' }}"

- name: Ensure dnf plugins for repository management
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Add Docker CE repository (EL)
  ansible.builtin.yum_repository:
    name: docker-ce
    description: Docker CE Stable - {{ ansible_distribution }} {{ ansible_distribution_major_version }}
    baseurl: "https://download.docker.com/linux/{{ docker_el_repo_name }}/{{ ansible_distribution_major_version }}/$basearch/stable"
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/{{ docker_el_repo_name }}/gpg
    enabled: true

- name: Install Docker Engine packages (RedHat family)
  ansible.builtin.dnf:
    name: "{{ ['docker-ce', 'docker-ce-cli', 'containerd.io', 'docker-buildx-plugin'] + (['docker-compose-plugin'] if docker_install_compose_plugin | bool else []) }}"
    state: present
  notify: Restart docker
