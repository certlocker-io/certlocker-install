---
- name: Install Docker (Debian family)
  ansible.builtin.include_tasks: install-Debian.yml
  when: ansible_facts.os_family == "Debian"

- name: Install Docker (RedHat family)
  ansible.builtin.include_tasks: install-RedHat.yml
  when: ansible_facts.os_family == "RedHat"

- name: Fail on unsupported OS family
  ansible.builtin.fail:
    msg: "docker role supports Debian and RedHat OS families only (got {{ ansible_facts.os_family }})."
  when: ansible_facts.os_family not in ["Debian", "RedHat"]

- name: Ensure Docker daemon config directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check existing Docker daemon config
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: docker_daemon_config_stat

- name: Read existing Docker daemon config
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon_config_slurp
  when:
    - docker_daemon_config_stat.stat.exists

- name: Configure Docker log rotation and optional registry DNS
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {{
        (
          (docker_daemon_config_slurp.content | default('') | b64decode | from_json)
          if (
            docker_daemon_config_stat.stat.exists
            and (docker_daemon_config_slurp.content | default('') | b64decode | trim | length > 0)
          ) else {}
        )
        | combine({'log-driver': 'local', 'log-opts': {'max-size': '20m', 'max-file': '5'}, 'live-restore': true}, recursive=true)
        | combine(({'dns': docker_daemon_dns_servers} if docker_daemon_dns_servers | default([]) | length > 0 else {}), recursive=true)
        | to_nice_json
      }}
  notify: Restart docker

- name: Ensure docker daemon is enabled and running
  ansible.builtin.service:
    name: docker
    state: "{{ docker_state }}"
    enabled: "{{ docker_enabled }}"

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: docker_users | length > 0
