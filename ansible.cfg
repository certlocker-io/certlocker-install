[defaults]
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = yaml
retry_files_enabled = False
forks = 20
timeout = 60
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=no -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o PreferredAuthentications=publickey
