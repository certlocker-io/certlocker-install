# IPv4 only (listen 80). Official image's IPv6 hook skips our file because this mount is :ro.
# Behind TLS-terminated HAProxy, $scheme here is always http; HAProxy sets X-Forwarded-Proto: https.
# Do not forward $scheme to apps or they redirect to https in a loop. Prefer incoming X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Do not cache stable asset names such as /assets/index.js. The bundle is
    # intentionally stable-named, so immutable caching can pin stale UI code.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Stack readiness for HAProxy checks (Edge + DS via HealthResource).
    location = /internal/haproxy-ready {
        proxy_pass http://edge:8500/edge/rest/health;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_set_header Host $host;
    }

    # Public gateway API without exposing the internal gateway context root.
    location /rest/api/v1/ {
        proxy_pass http://gateway:8300/gateway/rest/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Bare API base path. Google crawled https://trust.certlocker.io/rest/api and
    # recorded it as a 404, so serve a small JSON index instead. Real endpoints
    # live under /rest/api/v1/ and /rest/mcp.
    location = /rest/api {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 '{"service":"certlocker-rest-api","base":"/rest/api","endpoints":["/rest/api/v1/","/rest/mcp"],"docs":"https://docs.certlocker.io/"}\n';
    }

    location /rest/v1/secret/ {
        proxy_pass http://gateway:8300/gateway/rest/v1/secret/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # API reverse proxy to Edge REST context.
    # Dev parity: Vite maps /rest/* -> http://127.0.0.1:8080/edge/rest/*
    location /rest/ {
        proxy_pass http://edge:8500/edge/rest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA shell must not be cached long-term or browsers keep old JS (e.g. stale edgeApiRequest 404 -> /not-found).
    # X-Robots-Tag: the shell is the logged-in app, never an indexable document.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # WebSocket reverse proxy to Edge WS context.
    # Dev parity: Vite maps /ws/* -> ws://127.0.0.1:8080/edge/ws/*
    location /ws/ {
        proxy_pass http://edge:8500/edge/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers and default no-store for any remaining UI responses.
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
